name: Patch IPAs and Create Release

on:
  workflow_dispatch: # Позволяет запускать вручную кнопкой "Run workflow"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write # Разрешение на создание релизов и загрузку файлов

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run patch script
        run: python3 patch.py

      - name: Generate Automatic Tag & Release Name
        id: tag_name
        run: |
          # Создаем уникальный тег с датой и временем (например, v15-20261023-120000)
          TAG="v15-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release and Upload IPAs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: "Patched IPAs for iOS 15 (${{ steps.tag_name.outputs.tag }})"
          body: "Автоматически пропатченные файлы .ipa под iOS 15."
          files: output_ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto Download from GDrive, Patch and Release

on:
  workflow_dispatch: # Запуск одной кнопкой в интерфейсе GitHub

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write # Права на создание релизов и загрузку файлов

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdown
        run: pip install gdown

      - name: Run Auto Download & Patch
        run: python3 patch.py

      - name: Generate Tag & Release Name
        id: tag_name
        run: |
          TAG="v15-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release and Upload IPAs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: "Patched IPAs for iOS 15 (${{ steps.tag_name.outputs.tag }})"
          body: "Автоматически скачано с Google Drive и пропатчено под iOS 15."
          files: output_ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Patch IPAs and Upload to Releases

on:
  release:
    types: [published] # Сработает автоматически при публикации релиза
  workflow_dispatch:   # Сохраняем возможность ручного запуска через вкладку Actions

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write # Разрешение на загрузку файлов в Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run patch script
        run: python3 patch.py

      - name: Upload IPAs to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: output_ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
